name: Build portable (Mishuig-patch-3)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Гілка або тег для збірки'
        required: true
        default: 'Mishuig-patch-3'
  push:
    branches:
      - Mishuig-patch-3

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Знайти проєкт де б він не лежав (корінь або підпапка)
          $proj = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'DocumentGenerator.csproj' | Select-Object -First 1
          if (-not $proj) { throw 'DocumentGenerator.csproj не знайдено у гілці.' }
          $src = $proj.DirectoryName
          Write-Host "Project: $($proj.FullName)"

          $version = ([xml](Get-Content $proj.FullName)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { $version = '0.0.0' }
          $name = "DocumentGenerator-$version-portable-win-x64"
          $pkg  = Join-Path $env:GITHUB_WORKSPACE "publish\$name"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          dotnet restore $proj.FullName --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }

          dotnet publish $proj.FullName `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $pkg
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path (Join-Path $pkg 'DocumentGenerator.exe'))) { throw 'DocumentGenerator.exe was not produced.' }

          # Додаткові файли (якщо є в гілці)
          foreach ($f in 'App.ico','create-shortcut.ps1','Create-Shortcut.cmd') {
            $p = Join-Path $src $f
            if (Test-Path $p) { Copy-Item $p $pkg -Force }
          }
          if (Test-Path (Join-Path $src 'samples')) { Copy-Item (Join-Path $src 'samples') (Join-Path $pkg 'samples') -Recurse -Force }
          if (Test-Path (Join-Path $src 'README.md')) { Copy-Item (Join-Path $src 'README.md') (Join-Path $pkg 'README.txt') -Force }

          $zip = Join-Path $env:GITHUB_WORKSPACE "publish\$name.zip"
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath $zip -Force
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_ZIP=$zip"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created $zip"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error
          retention-days: 30
