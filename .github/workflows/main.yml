name: Build portable (Mishuig-patch-4)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to build
        required: true
        default: Mishuig-patch-4
        type: string
  push:
    branches:
      - Mishuig-patch-4
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '**.png'
      - '**.ico'
      - 'samples/**'
      - '.github/workflows/build-portable.yml'

permissions:
  contents: read

jobs:
  build:
    name: Publish Windows x64 portable
    runs-on: windows-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore .\DocumentGenerator.csproj --runtime win-x64

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish .\DocumentGenerator.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output .\publish\app
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path .\publish\app\DocumentGenerator.exe)) { throw 'DocumentGenerator.exe was not produced.' }

          Copy-Item .\README.md .\publish\app\README.txt -ErrorAction SilentlyContinue
          Copy-Item .\App.ico .\publish\app\App.ico -ErrorAction SilentlyContinue
          Copy-Item .\create-shortcut.ps1 .\publish\app\create-shortcut.ps1 -ErrorAction SilentlyContinue
          Copy-Item .\Create-Shortcut.cmd .\publish\app\Create-Shortcut.cmd -ErrorAction SilentlyContinue
          if (Test-Path .\samples) { Copy-Item .\samples .\publish\app\samples -Recurse -Force }

          Compress-Archive -Path .\publish\app\* -DestinationPath .\publish\DocumentGenerator-Mishuig-patch-4-portable-win-x64.zip -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DocumentGenerator-Mishuig-patch-4-portable-win-x64
          path: publish/DocumentGenerator-Mishuig-patch-4-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
